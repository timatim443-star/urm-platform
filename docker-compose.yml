# УРМ — запуск: docker compose up -d --build
# Настройки — в файле .env рядом (образец .env.example). Подробно: docs/01_РАЗВЕРТЫВАНИЕ.md
services:
  urm:
    build:
      context: .
      args:
        URM_VERSION: ${URM_VERSION:-dev}
    image: urm-platform:${URM_VERSION:-dev}
    container_name: urm-platform
    restart: unless-stopped
    env_file: [.env]
    environment:
      URM_SNAPSHOT_DIR: /app/snapshots
    volumes:
      - urm-snapshots:/app/snapshots     # снимок данных переживает перезапуск и обновление
    ports:
      - "${URM_BIND:-127.0.0.1}:${URM_PORT:-8501}:8501"   # наружу — через reverse-proxy с HTTPS
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    mem_limit: ${URM_MEMORY:-4g}

volumes:
  urm-snapshots:
