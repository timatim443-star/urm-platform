[project]
name = "urm-platform"
version = "2.3.0"
description = "УРМ — учёт расходных материалов: веб-платформа на витринах PostgreSQL urm2"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
# Копия генератора отчётов v4 — не форматируется и не правится (см. docs/03_АРХИТЕКТУРА.md).
extend-exclude = ["urm/report_core.py"]

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# _admin_env должен импортироваться раньше модулей urm — порядок важен.
"tools/*.py" = ["I001"]
